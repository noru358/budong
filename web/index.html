<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>budong V1 Fixture Prototype</title>
<style>
:root{font-family:Inter,Pretendard,system-ui,sans-serif;color:#111;background:#f6f6f3}*{box-sizing:border-box}body{margin:0}.top{padding:10px 20px;background:#201f1c;color:#fff;font-size:13px}.shell{max-width:1120px;margin:auto;padding:20px}.nav{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 24px}.nav button,.btn{border:1px solid #c9c7c0;background:white;border-radius:10px;padding:10px 14px;cursor:pointer}.nav .active,.btn{background:#111;color:white}.search{display:flex;gap:8px}.search input{flex:1;padding:14px;border:1px solid #c9c7c0;border-radius:12px;font-size:16px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px}.card{background:white;border:1px solid #dedbd2;border-radius:14px;padding:16px;margin:10px 0}.meta{color:#6b6962;font-size:13px}.stage{font-weight:800;margin-top:8px}.official{font-size:26px;font-weight:900}.plain{background:#eeece6;border-radius:12px;padding:14px;margin:16px 0}.badge{display:inline-block;border:1px solid #c8c5bb;border-radius:999px;padding:4px 8px;font-size:12px}.warn{border-color:#d7b76b;background:#fffaf0}.map{height:520px;position:relative;background:linear-gradient(#f1f1ee 1px,transparent 1px),linear-gradient(90deg,#f1f1ee 1px,transparent 1px);background-size:32px 32px;border:1px solid #d8d5cc;border-radius:16px;overflow:hidden}.pin{position:absolute;transform:translate(-50%,-50%);border:0;border-radius:999px;width:28px;height:28px;background:#111;color:#fff;cursor:pointer}.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px}.kpi{background:white;border:1px solid #dedbd2;border-radius:12px;padding:14px}.kpi strong{font-size:22px;display:block;margin-top:6px}table{width:100%;border-collapse:collapse;background:white}th,td{padding:10px;border-bottom:1px solid #eee;text-align:left}h1{font-size:28px}h2{margin-top:28px}@media(max-width:640px){.shell{padding:14px}.map{height:420px}.search{flex-direction:column}}
</style>
</head>
<body>
<div class="top">FIXTURE ONLY · 실제 투자판단 금지 · 공식 법적/권리 사실은 원문 확인 전 NEEDS_REVIEW</div>
<div class="shell">
<nav class="nav" id="nav">
<button data-v="home" class="active">홈</button><button data-v="map">지도</button><button data-v="search">검색</button><button data-v="detail">구역 상세</button><button data-v="analysis">물건 분석·비교</button>
</nav>
<main id="app"></main>
</div>
<script type="module">
import {PROJECTS,INVESTMENT_CASES,searchProjects,computeInvestmentCase} from "../src/prototype.mjs";
const app=document.querySelector("#app"), nav=document.querySelector("#nav");
let view="home", current=PROJECTS[0].id;
const won=(v)=>v==null?"확인 필요":(v/100000000).toFixed(2)+"억";
const pct=(v)=>v==null?"확인 필요":(v*100).toFixed(1)+"%";
const pby=(id)=>PROJECTS.find(p=>p.id===id);
const cases=(id)=>INVESTMENT_CASES.filter(c=>c.project_id===id);
function card(p){return '<div class="card" data-p="'+p.id+'"><b>'+p.canonical_name+'</b><div class="meta">'+p.project_type_name_official+' · '+p.jurisdiction+'</div><div class="stage">'+p.current_stage_name_official+'</div></div>'}
function bind(){document.querySelectorAll("[data-p]").forEach(x=>x.onclick=()=>{current=x.dataset.p;set("detail")})}
function set(v){view=v;nav.querySelectorAll("button").forEach(b=>b.classList.toggle("active",b.dataset.v===v));render()}
nav.onclick=e=>{const b=e.target.closest("[data-v]");if(b)set(b.dataset.v)};
function home(){
 app.innerHTML='<h1>서울 재개발·재건축을 찾고, 물건의 돈 흐름까지 본다</h1><div class="search"><input id="hq" placeholder="구역·단지·주소·역 검색"><button class="btn" id="hgo">검색</button></div><h2>최근 본 곳</h2><div class="grid">'+PROJECTS.slice(0,3).map(card).join("")+'</div><h2>분석 중 물건</h2>'+cases(PROJECTS[0].id).map(c=>{const m=computeInvestmentCase(c).metrics;return '<div class="card"><b>'+PROJECTS[0].canonical_name+' · '+c.label+'</b><div class="meta">처음 '+won(m.initial_equity_required)+' · 최대 '+won(m.peak_cumulative_equity)+'</div></div>'}).join("");
 document.querySelector("#hgo").onclick=()=>{sessionStorage.q=document.querySelector("#hq").value;set("search")};bind();
}
function search(){
 const q=sessionStorage.q||"";const rows=q?searchProjects(PROJECTS,q):[];
 app.innerHTML='<h1>검색</h1><div class="search"><input id="q" value="'+q+'" placeholder="구역·단지·주소·역 검색"><button class="btn" id="go">검색</button></div><div id="res">'+(rows.length?rows.map(r=>card(r.project)).join(""):'<div class="card meta">검색어를 입력하세요.</div>')+'</div>';
 document.querySelector("#go").onclick=()=>{sessionStorage.q=document.querySelector("#q").value;search()};bind();
}
function map(){
 const xs=PROJECTS.map(p=>p.centroid.lng),ys=PROJECTS.map(p=>p.centroid.lat),xmin=Math.min(...xs)-.01,xmax=Math.max(...xs)+.01,ymin=Math.min(...ys)-.01,ymax=Math.max(...ys)+.01;
 app.innerHTML='<h1>지도</h1><p class="meta">Fixture 위치도 · 실제 공식 경계/배경지도는 Gate 2에서 source adapter 연결 후 표시합니다.</p><div class="map">'+PROJECTS.map((p,i)=>{const x=(p.centroid.lng-xmin)/(xmax-xmin)*92+4,y=(ymax-p.centroid.lat)/(ymax-ymin)*90+5;return '<button class="pin" data-p="'+p.id+'" style="left:'+x+'%;top:'+y+'%" title="'+p.canonical_name+' · '+p.current_stage_name_official+'">'+(i+1)+'</button>'}).join("")+'</div>';bind();
}
function detail(){
 const p=pby(current);
 app.innerHTML='<div class="meta">'+p.project_type_name_official+' · '+p.jurisdiction+'</div><h1>'+p.canonical_name+'</h1><div class="official">'+p.current_stage_name_official+'</div><div class="meta">효력/기준일 '+p.current_stage_effective_date+' · 최근 확인 '+p.verified_at+'</div><p><span class="badge">'+p.boundary_kind+'</span> <span class="badge">'+p.certainty+'</span></p><div class="plain"><b>쉽게 보기</b><br>'+p.current_stage_plain_explanation+'</div><h2>권리·규제</h2>'+p.rights_events.map(e=>'<div class="card warn"><b>'+e.event_name_official+'</b><div class="meta">'+e.status+' · '+e.note+'</div></div>').join("")+'<h2>Fixture 물건</h2><div class="grid">'+cases(p.id).map(c=>'<div class="card"><b>'+c.label+'</b><br><button class="btn" data-c="'+c.id+'" style="margin-top:10px">분석</button></div>').join("")+'</div>';
 document.querySelectorAll("[data-c]").forEach(b=>b.onclick=()=>{sessionStorage.case=b.dataset.c;set("analysis")});
}
function analysis(){
 const a=INVESTMENT_CASES.find(c=>c.id===(sessionStorage.case||INVESTMENT_CASES[0].id))||INVESTMENT_CASES[0];
 const b=INVESTMENT_CASES.find(c=>c.project_id===a.project_id&&c.id!==a.id)||INVESTMENT_CASES[1];
 const ma=computeInvestmentCase(a).metrics,mb=computeInvestmentCase(b).metrics;
 const row=(n,x,y,f=won)=>'<tr><th>'+n+'</th><td>'+f(x)+'</td><td>'+f(y)+'</td></tr>';
 app.innerHTML='<h1>물건 분석·비교</h1><h2>'+pby(a.project_id).canonical_name+' · '+a.label+'</h2><div class="kpis"><div class="kpi">지금 필요한 내 돈<strong>'+won(ma.initial_equity_required)+'</strong></div><div class="kpi">앞으로 추가 내 돈<strong>'+won(ma.future_additional_equity)+'</strong></div><div class="kpi">최대 누적 자기자금<strong>'+won(ma.peak_cumulative_equity)+'</strong></div><div class="kpi">전체 경제적 비용<strong>'+won(ma.total_economic_cost)+'</strong></div><div class="kpi">기준 세전손익<strong>'+won(ma.pretax_profit)+'</strong></div><div class="kpi warn">가장 중요한 미확인사항<strong style="font-size:14px">'+a.unresolved_items[0]+'</strong></div></div><h2>상세 비교</h2><table><thead><tr><th>지표</th><th>'+a.label+'</th><th>'+b.label+'</th></tr></thead><tbody>'+row("초기 자기자금",ma.initial_equity_required,mb.initial_equity_required)+row("최대 누적 자기자금",ma.peak_cumulative_equity,mb.peak_cumulative_equity)+row("총 경제적 비용",ma.total_economic_cost,mb.total_economic_cost)+row("세전손익",ma.pretax_profit,mb.pretax_profit)+row("MOIC",ma.moic,mb.moic,x=>x.toFixed(2)+"x")+row("XIRR",ma.xirr,mb.xirr,pct)+row("손익분기 매도가",ma.break_even_exit_price,mb.break_even_exit_price)+'</tbody></table><div class="card warn"><b>법적/권리 사실</b><div class="meta">이 화면은 투자추천이 아닙니다. fixture의 권리산정기준일·조합원 지위·분양자격은 실제 원문 확인 전 모두 NEEDS_REVIEW입니다.</div></div>';
}
function render(){({home,map,search,detail,analysis}[view]||home)()}
render();
</script>
</body>
</html>
