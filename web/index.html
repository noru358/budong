<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="theme-color" content="#ffffff" />
    <title>budong — 서울 정비사업 검토</title>
    <link rel="stylesheet" href="./vendor/leaflet/leaflet.css" />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <a class="skip-link" href="#app">본문으로 이동</a>
    <header class="header">
      <a class="brand" href="#home" aria-label="budong 구역 탐색"
        ><span class="brand-symbol" aria-hidden="true"
          ><svg viewBox="0 0 24 24">
            <path d="M6 4v16m0-8a6 6 0 1 1 0 7" />
            <path d="M10 8h8" /></svg></span
        >budong<span class="brand-divider"></span
        ><span class="brand-caption">서울 정비사업</span></a
      >
      <div class="header-actions">
        <a class="header-source-link" href="#sources">출처·이용조건</a
        ><button id="demo-shortcut" class="quiet-button">계산 예시</button
        ><span class="private">개인 검토</span>
      </div>
    </header>
    <nav id="nav" class="nav" aria-label="주요 화면">
      <button data-view="home">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M4 4h6v6H4zm10 0h6v6h-6zM4 14h6v6H4zm10 0h6v6h-6z" /></svg
        ><span>구역 탐색</span>
      </button>
      <button data-view="map">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="m3 5 6-2 6 2 6-2v16l-6 2-6-2-6 2zM9 3v16m6-14v16" /></svg
        ><span>지도</span>
      </button>
      <button data-view="search" class="search-shortcut" hidden>
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <circle cx="10" cy="10" r="6.5" />
          <path d="m15 15 6 6" /></svg
        ><span>검색</span>
      </button>
      <button data-view="detail">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M5 3h14v18H5zM9 8h6m-6 4h6m-6 4h4" /></svg
        ><span>구역 상세</span>
      </button>
      <button data-view="analysis">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M4 3v18h17M8 17v-5m5 5V6m5 11V9" /></svg
        ><span>내 물건</span
        ><span id="workspace-count" class="nav-count">0</span>
      </button>
    </nav>
    <div class="layout">
      <div id="notice" role="status" aria-live="polite"></div>
      <main id="app" tabindex="-1">
        <div class="loading-state">구역 자료를 불러오고 있습니다.</div>
      </main>
      <footer>
        공식 관찰값과 사용자 입력·가정을 구분합니다. 내 물건은 이 브라우저에
        저장합니다.
      </footer>
    </div>
    <script type="module" src="./app.mjs"></script>
  </body>
</html>
