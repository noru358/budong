name: Live Data Smoke

on:
  workflow_dispatch:
    inputs:
      deal_ymd:
        description: "RTMS 계약년월 YYYYMM (빈 값이면 현재 서울 기준 월)"
        required: false
        type: string
      lawd_cd:
        description: "RTMS 시군구 코드 (기본 11590 동작구)"
        required: false
        default: "11590"
        type: string
      sigungu_cd:
        description: "건축물 시군구 코드"
        required: false
        default: "11590"
        type: string
      bjdong_cd:
        description: "건축물 법정동 코드 (기본 10200 상도동)"
        required: false
        default: "10200"
        type: string
      bun:
        description: "건축물 본번 4자리 (기본 0418)"
        required: false
        default: "0418"
        type: string
      ji:
        description: "건축물 부번 4자리"
        required: false
        default: "0000"
        type: string
      plat_gb_cd:
        description: "건축물 대지구분 (0 대지 / 1 산 / 2 블록)"
        required: false
        default: "0"
        type: string
      all_pages:
        description: "제공기관 totalCount와 페이지 메타데이터로 전페이지 조회 검증"
        required: false
        default: false
        type: boolean
      max_pages:
        description: "전페이지 조회 상한 (최대100, 상한 도달은 PARTIAL_CAP)"
        required: false
        default: "20"
        type: string
      num_of_rows:
        description: "전페이지 조회 페이지 크기 (최대1000)"
        required: false
        default: "100"
        type: string

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        service_type: [RH, APT, SH]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Smoke RTMS and Building HUB
        shell: bash
        env:
          DATA_GO_KR_SERVICE_KEY: ${{ secrets.DATA_GO_KR_SERVICE_KEY }}
          SMOKE_DEAL_YMD: ${{ inputs.deal_ymd }}
          SMOKE_LAWD_CD: ${{ inputs.lawd_cd }}
          SMOKE_SIGUNGU_CD: ${{ inputs.sigungu_cd }}
          SMOKE_BJDONG_CD: ${{ inputs.bjdong_cd }}
          SMOKE_BUN: ${{ inputs.bun }}
          SMOKE_JI: ${{ inputs.ji }}
          SMOKE_PLAT_GB_CD: ${{ inputs.plat_gb_cd }}
          SMOKE_ALL_PAGES: ${{ inputs.all_pages }}
          SMOKE_MAX_PAGES: ${{ inputs.max_pages }}
          SMOKE_NUM_OF_ROWS: ${{ inputs.num_of_rows }}
          SMOKE_SERVICE_TYPE: ${{ matrix.service_type }}
        run: |
          set -o pipefail
          mkdir -p runtime/live-smoke
          node scripts/live_data_smoke.mjs | tee runtime/live-smoke/summary.json
      - name: Upload both service results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.service_type == 'RH' && 'live-data-smoke-summary' || format('live-data-smoke-summary-{0}', matrix.service_type) }}
          path: runtime/live-smoke/summary.json
          retention-days: 7
